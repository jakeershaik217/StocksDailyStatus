name: Fast OFS Monitor

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE OFS symbol"
        required: true
        default: "HINDCOPPER"
        type: string
      bse_scrip_code:
        description: "BSE numeric scrip code"
        required: true
        default: "513599"
        type: string
      offer_date:
        description: "Non-retail OFS date as DD-Mon-YYYY; blank auto-detects"
        required: false
        default: ""
        type: string
      retail_date:
        description: "Retail OFS date as DD-Mon-YYYY; blank auto-detects"
        required: false
        default: ""
        type: string
      reference_cutoff:
        description: "Confirmed non-retail cutoff; blank reads NSE final summary"
        required: false
        default: ""
        type: string
      retail_reserved_quantity:
        description: "Exact retail quantity if known"
        required: false
        default: ""
        type: string
      gross_final_offer_quantity:
        description: "Gross final OFS quantity; used to derive retail quantity if exact retail quantity is blank"
        required: false
        default: "58021442"
        type: string
      retail_reserved_pct:
        description: "Fallback retail reservation percentage"
        required: false
        default: "10"
        type: string
      start_time:
        description: "Monitor start time IST (HH:MM:SS)"
        required: true
        default: "15:20:00"
        type: string
      end_time:
        description: "Monitor end time IST (HH:MM:SS)"
        required: true
        default: "15:30:00"
        type: string
      max_source_age_seconds:
        description: "Warn if an exchange timestamp is older than this"
        required: true
        default: "20"
        type: string
      max_source_skew_seconds:
        description: "Warn if NSE and BSE timestamps differ by more than this"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: fast-ofs-monitor-${{ inputs.symbol }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only live-monitor dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests curl-cffi

      - name: Run Fast OFS Monitor
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          BSE_SCRIP_CODE: ${{ inputs.bse_scrip_code }}
          OFS_OFFER_DATE: ${{ inputs.offer_date }}
          OFS_RETAIL_DATE: ${{ inputs.retail_date }}
          OFS_REFERENCE_CUTOFF: ${{ inputs.reference_cutoff }}
          OFS_RETAIL_RESERVED_QUANTITY: ${{ inputs.retail_reserved_quantity }}
          OFS_GROSS_FINAL_OFFER_QUANTITY: ${{ inputs.gross_final_offer_quantity }}
          OFS_RETAIL_RESERVED_PCT: ${{ inputs.retail_reserved_pct }}
          OFS_START_TIME: ${{ inputs.start_time }}
          OFS_END_TIME: ${{ inputs.end_time }}
          OFS_MAX_SOURCE_AGE_SECONDS: ${{ inputs.max_source_age_seconds }}
          OFS_MAX_SOURCE_SKEW_SECONDS: ${{ inputs.max_source_skew_seconds }}
          OFS_INTERVAL_BEFORE_1525: "15"
          OFS_INTERVAL_1525_1529: "5"
          OFS_INTERVAL_1529_152930: "4"
          OFS_INTERVAL_FINAL_30S: "2"
        run: python scripts/fast_ofs_monitor_v2.py

      - name: Upload final monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-ofs-monitor-${{ inputs.symbol }}-${{ github.run_number }}
          path: |
            fast-ofs-monitor.json
            fast-ofs-monitor.md
          if-no-files-found: warn
