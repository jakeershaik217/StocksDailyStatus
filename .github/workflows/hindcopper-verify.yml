name: HINDCOPPER OFS Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hindcopper-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run live HINDCOPPER non-retail assessment
        env:
          OFS_SYMBOL: HINDCOPPER
          OFS_SERIES: IS
          OFS_CATEGORY: NON_RETAIL
          OFS_OFFER_DATE: 25-Aug-2026
          BSE_SCRIP_CODE: "513599"
          OFS_MAX_LIVE_AGE_MINUTES: "15"
          OFS_MAX_SOURCE_SKEW_MINUTES: "10"
        run: python scripts/live_ofs.py
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindcopper-ofs-verification
          path: |
            ofs-report.md
            ofs-live-snapshot.json
          if-no-files-found: error
