name: OFS Cutoff Analyzer

on:
  push:
    branches:
      - main
      - fix/retail-ofs-live-analysis
    paths:
      - ".github/workflows/ofs-cutoff.yml"
      - "ofs/**"
      - "scripts/live_ofs.py"
      - "scripts/live_retail_ofs.py"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/ofs-cutoff.yml"
      - "ofs/**"
      - "scripts/live_ofs.py"
      - "scripts/live_retail_ofs.py"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "OFS category to analyze"
        required: true
        default: "RETAIL"
        type: choice
        options:
          - RETAIL
          - NON_RETAIL
      symbol:
        description: "NSE OFS symbol"
        required: true
        default: "HINDCOPPER"
        type: string
      bse_scrip_code:
        description: "BSE numeric scrip code"
        required: true
        default: "513599"
        type: string
      offer_date:
        description: "First OFS date as DD-Mon-YYYY"
        required: false
        default: "25-Aug-2026"
        type: string
      retail_date:
        description: "Retail session date; blank reads the NSE RS issue details"
        required: false
        default: ""
        type: string
      final_non_retail_quantity:
        description: "Optional final non-retail quantity override"
        required: false
        default: ""
        type: string
      gross_final_offer_quantity:
        description: "Gross final offer including retail reservation"
        required: false
        default: "58021442"
        type: string
      retail_reserved_quantity:
        description: "Optional exact retail quantity override"
        required: false
        default: ""
        type: string
      reference_cutoff:
        description: "Optional confirmed non-retail cutoff; blank reads NSE final value"
        required: false
        default: ""
        type: string
      retail_reserved_pct:
        description: "Fallback retail reservation percentage"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test non-retail reporting
        if: github.event_name != 'workflow_dispatch'
        env:
          OFS_SYMBOL: SMOKE
          OFS_SNAPSHOT_FILE: tests/fixtures/ofs_smoke.json
        run: python scripts/live_ofs.py
      - name: Run non-retail analyzer
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'NON_RETAIL'
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          OFS_SERIES: IS
          OFS_CATEGORY: NON_RETAIL
          OFS_OFFER_DATE: ${{ inputs.offer_date }}
          BSE_SCRIP_CODE: ${{ inputs.bse_scrip_code }}
          OFS_FINAL_OFFER_QUANTITY: ${{ inputs.final_non_retail_quantity }}
          OFS_MAX_LIVE_AGE_MINUTES: "15"
          OFS_MAX_SOURCE_SKEW_MINUTES: "3"
        run: python scripts/live_ofs.py
      - name: Run retail analyzer
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'RETAIL'
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          OFS_OFFER_DATE: ${{ inputs.offer_date }}
          OFS_RETAIL_DATE: ${{ inputs.retail_date }}
          BSE_SCRIP_CODE: ${{ inputs.bse_scrip_code }}
          OFS_REFERENCE_CUTOFF: ${{ inputs.reference_cutoff }}
          OFS_GROSS_FINAL_OFFER_QUANTITY: ${{ inputs.gross_final_offer_quantity }}
          OFS_RETAIL_RESERVED_QUANTITY: ${{ inputs.retail_reserved_quantity }}
          OFS_RETAIL_RESERVED_PCT: ${{ inputs.retail_reserved_pct }}
        run: python scripts/live_retail_ofs.py
      - name: Verify live HINDCOPPER retail feeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/retail-ofs-live-analysis'
        env:
          OFS_SYMBOL: HINDCOPPER
          OFS_OFFER_DATE: 25-Aug-2026
          OFS_RETAIL_DATE: 26-Aug-2026
          BSE_SCRIP_CODE: "513599"
          OFS_GROSS_FINAL_OFFER_QUANTITY: "58021442"
          OFS_RETAIL_RESERVED_PCT: "10"
        run: python scripts/live_retail_ofs.py
      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofs-cutoff-${{ github.run_number }}
          path: |
            ofs-report.md
            ofs-live-snapshot.json
          if-no-files-found: warn
