name: OFS Cutoff Analyzer

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE OFS symbol"
        required: true
        default: "HINDCOPPER"
        type: string
      bse_scrip_code:
        description: "BSE numeric scrip code"
        required: true
        default: "513599"
        type: string
      mode:
        description: "Analysis mode; AUTO uses reference cutoff presence to select retail"
        required: true
        default: "AUTO"
        type: choice
        options:
          - AUTO
          - NON_RETAIL
          - RETAIL
      offer_date:
        description: "OFS date as DD-Mon-YYYY; blank lets exchange details supply it"
        required: false
        default: ""
        type: string
      final_offer_quantity:
        description: "Final offer quantity after green-shoe"
        required: false
        default: ""
        type: string
      reference_cutoff:
        description: "Confirmed T-day non-retail cutoff for RETAIL/AUTO retail mode; e.g. 520.00"
        required: false
        default: ""
        type: string
      retail_reserved_pct:
        description: "Retail reservation percentage when not otherwise exposed"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run non-retail analyzer
        if: inputs.mode == 'NON_RETAIL' || (inputs.mode == 'AUTO' && inputs.reference_cutoff == '')
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          OFS_SERIES: IS
          OFS_CATEGORY: NON_RETAIL
          OFS_OFFER_DATE: ${{ inputs.offer_date }}
          BSE_SCRIP_CODE: ${{ inputs.bse_scrip_code }}
          OFS_FINAL_OFFER_QUANTITY: ${{ inputs.final_offer_quantity }}
          OFS_MAX_LIVE_AGE_MINUTES: "15"
          OFS_MAX_SOURCE_SKEW_MINUTES: "3"
        run: python scripts/live_ofs.py
      - name: Run retail analyzer
        if: inputs.mode == 'RETAIL' || (inputs.mode == 'AUTO' && inputs.reference_cutoff != '')
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          OFS_OFFER_DATE: ${{ inputs.offer_date }}
          BSE_SCRIP_CODE: ${{ inputs.bse_scrip_code }}
          OFS_REFERENCE_CUTOFF: ${{ inputs.reference_cutoff }}
          OFS_FINAL_OFFER_QUANTITY: ${{ inputs.final_offer_quantity }}
          OFS_RETAIL_RESERVED_PCT: ${{ inputs.retail_reserved_pct }}
        run: python scripts/live_retail_ofs.py
      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofs-cutoff-${{ github.run_number }}
          path: |
            ofs-report.md
            ofs-live-snapshot.json
          if-no-files-found: warn
