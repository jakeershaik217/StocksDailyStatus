name: OFS Cutoff Analyzer

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol"
        required: true
        type: string
      final_offer_quantity:
        description: "Final T-day non-retail offer quantity, including exercised oversubscription if applicable"
        required: true
        type: number
      category:
        description: "OFS category"
        required: true
        default: "NON_RETAIL"
        type: choice
        options:
          - NON_RETAIL
          - GENERAL
          - HNI
      nse_mbp_url:
        description: "NSE e-OFS Market By Price endpoint"
        required: true
        type: string
      bse_depth_url:
        description: "BSE OFS depth endpoint"
        required: true
        type: string
      bid_snapshot_json:
        description: "Optional final T-day consolidated bid JSON if exchange endpoints are unavailable"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run T-day final cutoff analyzer
        env:
          OFS_SYMBOL: ${{ inputs.symbol }}
          OFS_OFFERED: ${{ inputs.final_offer_quantity }}
          OFS_CATEGORY: ${{ inputs.category }}
          NSE_MBP_URL: ${{ inputs.nse_mbp_url }}
          BSE_DEPTH_URL: ${{ inputs.bse_depth_url }}
          OFS_FINAL_BID_JSON: ${{ inputs.bid_snapshot_json }}
        run: python scripts/live_ofs.py
